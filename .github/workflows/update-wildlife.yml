name: Update wildlife map

on:

  workflow_dispatch:

  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write


jobs:

  update-wildlife:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install requests


      - name: Fetch iNaturalist observations
        run: |

          python scripts/fetch_inaturalist.py


      - name: Commit updated wildlife data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/wildlife.json


          if git diff --cached --quiet; then

            echo "No wildlife data changes."

            exit 0

          fi


          git commit \
            -m "Update iNaturalist wildlife dataset"


          git push
